AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CiteWise AI – Serverless RAG Knowledge Assistant
  Components: S3 · Lambda · API Gateway HTTP API · DynamoDB · Amazon Bedrock

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:

  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Region where Bedrock models (Titan + Claude) are enabled

  CorsOrigin:
    Type: String
    Default: "*"
    Description: Allowed CORS origin – set to your frontend URL in production

  MaxPages:
    Type: Number
    Default: 20
    Description: Maximum PDF pages to process

  TopK:
    Type: Number
    Default: 5
    Description: Chunks retrieved per query

  SimilarityThreshold:
    Type: String
    Default: "0.25"
    Description: Minimum cosine similarity to include a chunk

# ─────────────────────────────────────────────────────────────────────────────
# Globals
# ─────────────────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime:       python3.12
    Architectures: [x86_64]
    MemorySize:    256
    Timeout:       30
    Layers:
      - !Ref SharedUtilsLayer
    Environment:
      Variables:
        DOCUMENTS_TABLE:   !Ref DocumentsTable
        CHUNKS_TABLE:      !Ref ChunksTable
        DOCUMENTS_BUCKET:  !Ref DocumentsBucket
        BEDROCK_REGION:    !Ref BedrockRegion
        CORS_ORIGIN:       !Ref CorsOrigin
        MAX_PAGES:         !Ref MaxPages
        TOP_K:             !Ref TopK
        SIM_THRESHOLD:     !Ref SimilarityThreshold
        LOG_LEVEL:         INFO

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ── S3 bucket ────────────────────────────────────────────────────────────────
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3InvokeProcessorPermission
    Properties:
      BucketName: !Sub "citewise-documents-${AWS::AccountId}-${Stage}"
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls:       true
        BlockPublicPolicy:     true
        IgnorePublicAcls:      true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT, HEAD]
            AllowedOrigins:
              - !Ref CorsOrigin
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AutoExpireDocuments
            Status: Enabled
            ExpirationInDays: 7
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: "documents/"
            Function: !GetAtt DocumentProcessorFunction.Arn

  # Permission for S3 to invoke the processor Lambda
  S3InvokeProcessorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt DocumentProcessorFunction.Arn
      Action:        lambda:InvokeFunction
      Principal:     s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # ── DynamoDB: documents ───────────────────────────────────────────────────────
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:    !Sub "citewise-documents-${Stage}"
      BillingMode:  PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: document_id
          AttributeType: S
      KeySchema:
        - AttributeName: document_id
          KeyType: HASH

  # ── DynamoDB: chunks ──────────────────────────────────────────────────────────
  ChunksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:   !Sub "citewise-chunks-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chunk_id
          AttributeType: S
        - AttributeName: document_id
          AttributeType: S
      KeySchema:
        - AttributeName: chunk_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: document_id-index
          KeySchema:
            - AttributeName: document_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ── API Gateway HTTP API ───────────────────────────────────────────────────────
  CiteWiseApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName:   !Ref Stage
      Description: CiteWise AI – document Q&A API
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        MaxAge: 600

  # ── Shared Lambda Layer ────────────────────────────────────────────────────────
  SharedUtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:          !Sub "citewise-shared-${Stage}"
      Description:        Shared utilities – Bedrock helpers, chunking, cosine sim
      ContentUri:         layers/shared/
      CompatibleRuntimes: [python3.12]
      RetentionPolicy:    Delete
    Metadata:
      BuildMethod: python3.12

  # ── IAM Role shared by all Lambdas ─────────────────────────────────────────────
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "citewise-lambda-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CiteWisePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              # DynamoDB
              - Sid: DynamoDB
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                Resource:
                  - !GetAtt DocumentsTable.Arn
                  - !GetAtt ChunksTable.Arn
                  - !Sub "${ChunksTable.Arn}/index/*"

              # S3 – objects
              - Sid: S3Objects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "arn:aws:s3:::citewise-documents-${AWS::AccountId}-${Stage}/*"

              # S3 – bucket (needed for presigned URL generation)
              - Sid: S3Bucket
                Effect: Allow
                Action: [s3:ListBucket]
                Resource: !Sub "arn:aws:s3:::citewise-documents-${AWS::AccountId}-${Stage}"

              # Bedrock – Titan Embeddings V2 + Claude 3 Haiku
              - Sid: Bedrock
                Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource:
                  - !Sub "arn:aws:bedrock:${BedrockRegion}::foundation-model/amazon.titan-embed-text-v2:0"
                  - !Sub "arn:aws:bedrock:${BedrockRegion}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"

              # CloudWatch Logs
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: "arn:aws:logs:*:*:*"

  # ── Lambda: upload-handler ─────────────────────────────────────────────────────
  UploadHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "citewise-upload-handler-${Stage}"
      CodeUri:      functions/upload_handler/
      Handler:      handler.lambda_handler
      Description:  Validates upload, creates DynamoDB record, returns presigned S3 URL
      Role:         !GetAtt LambdaRole.Arn
      Timeout:      15
      MemorySize:   128
      Events:
        Upload:
          Type: HttpApi
          Properties:
            ApiId:  !Ref CiteWiseApi
            Path:   /upload
            Method: POST
        UploadPreflight:
          Type: HttpApi
          Properties:
            ApiId:  !Ref CiteWiseApi
            Path:   /upload
            Method: OPTIONS

  # ── Lambda: document-processor ────────────────────────────────────────────────
  DocumentProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "citewise-document-processor-${Stage}"
      CodeUri:      functions/document_processor/
      Handler:      handler.lambda_handler
      Description:  S3-triggered text extraction, chunking, embedding, DynamoDB storage
      Role:         !GetAtt LambdaRole.Arn
      Timeout:      300      # large PDFs with 20 pages + 40 chunks can take ~3 min
      MemorySize:   512      # pypdf + embedding vectors

  # ── Lambda: document-manager ──────────────────────────────────────────────────
  DocumentManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "citewise-document-manager-${Stage}"
      CodeUri:      functions/document_manager/
      Handler:      handler.lambda_handler
      Description:  CRUD for document metadata – list, get, delete
      Role:         !GetAtt LambdaRole.Arn
      Timeout:      15
      MemorySize:   128
      Events:
        ListDocs:
          Type: HttpApi
          Properties:
            ApiId:  !Ref CiteWiseApi
            Path:   /documents
            Method: GET
        GetDoc:
          Type: HttpApi
          Properties:
            ApiId:  !Ref CiteWiseApi
            Path:   /documents/{id}
            Method: GET
        DeleteDoc:
          Type: HttpApi
          Properties:
            ApiId:  !Ref CiteWiseApi
            Path:   /documents/{id}
            Method: DELETE
        DocsPreflight:
          Type: HttpApi
          Properties:
            ApiId:  !Ref CiteWiseApi
            Path:   /documents
            Method: OPTIONS
        DocIdPreflight:
          Type: HttpApi
          Properties:
            ApiId:  !Ref CiteWiseApi
            Path:   /documents/{id}
            Method: OPTIONS

  # ── Lambda: query-handler ─────────────────────────────────────────────────────
  QueryHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "citewise-query-handler-${Stage}"
      CodeUri:      functions/query_handler/
      Handler:      handler.lambda_handler
      Description:  RAG pipeline – embed question, retrieve chunks, Claude 3 Haiku, citations
      Role:         !GetAtt LambdaRole.Arn
      Timeout:      60       # Bedrock calls ~10-20s
      MemorySize:   256
      Events:
        QueryDoc:
          Type: HttpApi
          Properties:
            ApiId:  !Ref CiteWiseApi
            Path:   /documents/{id}/query
            Method: POST
        AskRoute:
          Type: HttpApi
          Properties:
            ApiId:  !Ref CiteWiseApi
            Path:   /ask
            Method: POST
        QueryPreflight:
          Type: HttpApi
          Properties:
            ApiId:  !Ref CiteWiseApi
            Path:   /documents/{id}/query
            Method: OPTIONS
        AskPreflight:
          Type: HttpApi
          Properties:
            ApiId:  !Ref CiteWiseApi
            Path:   /ask
            Method: OPTIONS

  # ── CloudWatch Log Groups (7-day retention) ────────────────────────────────────
  LogGroupUpload:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:    !Sub "/aws/lambda/citewise-upload-handler-${Stage}"
      RetentionInDays: 7

  LogGroupProcessor:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:    !Sub "/aws/lambda/citewise-document-processor-${Stage}"
      RetentionInDays: 7

  LogGroupManager:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:    !Sub "/aws/lambda/citewise-document-manager-${Stage}"
      RetentionInDays: 7

  LogGroupQuery:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:    !Sub "/aws/lambda/citewise-query-handler-${Stage}"
      RetentionInDays: 7

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value:        !Sub "https://${CiteWiseApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "CiteWiseApiUrl-${Stage}"

  BucketName:
    Description: S3 documents bucket
    Value:        !Ref DocumentsBucket

  DocumentsTableName:
    Description: DynamoDB documents table
    Value:        !Ref DocumentsTable

  ChunksTableName:
    Description: DynamoDB chunks table
    Value:        !Ref ChunksTable
